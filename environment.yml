name: feddog
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=2.4.6
  - pillow=12.3.0
  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - transformers==5.14.1
      - diffusers==0.39.0
      - accelerate==1.14.0
      - safetensors==0.8.0
      - tokenizers==0.22.2
      - ftfy==6.3.1
      - datasets==5.0.1
